name: Build Payam VPN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --platforms android --project-name payam_vpn app

      - name: Copy app screen
        run: cp lib/main.dart app/lib/main.dart

      - name: Add VPN dependency
        working-directory: app
        run: |
          flutter pub add sing_box
          flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Payam-VPN
          path: app/build/app/outputs/flutter-apk/app-release.apk
