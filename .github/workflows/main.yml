name: Build Payam VPN APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Flutter project
        run: flutter create --platforms android --project-name payam_vpn app
      - name: Copy app screen
        run: cp lib/main.dart app/lib/main.dart
      - name: Build APK
        working-directory: app
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Payam-VPN
          path: app/build/app/outputs/flutter-apk/app-release.apk
