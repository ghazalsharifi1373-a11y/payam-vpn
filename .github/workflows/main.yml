
name: Build Payam VPN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: flutter create --org com.payamvpn --project-name payam_vpn app

      - name: Copy app files
        run: |
          mkdir -p app/lib
          cp lib/main.dart app/lib/main.dart
          cp pubspec.yaml app/pubspec.yaml

      - name: Install dependencies
        working-directory: app
        run: |
          flutter pub add flutter_v2ray_client:^3.5.0
          flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Payam-VPN-Android
          path: app/build/app/outputs/flutter-apk/app-release.apk
